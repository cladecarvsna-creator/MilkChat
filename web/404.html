<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Страница не найдена — MilkChat</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    :root { --bg: #0E211D; --card: #1B3A33; --text: #F1F5F4; --muted: #9DBDB3; --accent: #5EE0C0; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%; max-width: 420px; text-align: center;
      background: var(--card); border-radius: 36px; padding: 40px 28px 32px;
    }
    img { width: 88px; height: 88px; border-radius: 24px; }
    .code { font-size: 72px; font-weight: 800; line-height: 1; margin: 20px 0 8px; color: var(--accent); }
    h1 { font-size: 24px; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 28px; line-height: 1.5; }
    a.btn {
      display: block; padding: 15px; border-radius: 999px;
      background: var(--accent); color: #0E211D; font-weight: 700; text-decoration: none;
    }
    a.btn:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <main class="card">
    <img src="/icons/Icon-192.png" alt="MilkChat">
    <div class="code">404</div>
    <h1>Страница не найдена</h1>
    <p>Такого адреса в MilkChat нет. Возможно, ссылка устарела или в ней опечатка.</p>
    <a class="btn" href="/">Открыть MilkChat</a>
  </main>
</body>
</html>
