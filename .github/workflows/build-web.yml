name: Build Web (REG.RU)

# Собирает веб-версию для https://milk.lozhka.fun. Готовая папка — артефакт
# milkchat-web: её содержимое загружается в корень сайта через ISPmanager.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --base-href / --dart-define=BUILD=${GITHUB_SHA::7}
      # Имена файлов кода с номером сборки — иначе браузер берёт старый main.dart.js из кэша.
      - run: tool/cache_bust.sh build/web ${GITHUB_SHA::7}
      - name: Проверить, что .htaccess попал в сборку
        run: test -f build/web/.htaccess
      - uses: actions/upload-artifact@v4
        with:
          name: milkchat-web
          path: build/web
          include-hidden-files: true
